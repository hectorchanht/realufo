<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="RealUFO — newest UAP files" href="/rss.xml" />
    <!-- Thumbnails (the LCP image) come from the R2 custom domain. -->
    <link rel="preconnect" href="https://assets.realufo.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealUFO — Declassified UAP Archive</title>
    <meta name="theme-color" content="#07080c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RealUFO" />
    <!-- Default meta. The Worker (worker/lib/meta.ts) swaps everything between the
         META markers for per-route tags on deep links; keep both markers. -->
    <!--META-->
    <meta name="description" content="Searchable archive of declassified UAP/UFO records from the Pentagon, CIA, FBI and NASA, with case files, a sighting map and anonymous discussion boards." />
    <meta property="og:site_name" content="RealUFO" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RealUFO — Declassified UAP Archive" />
    <meta property="og:description" content="Searchable archive of declassified UAP/UFO records from the Pentagon, CIA, FBI and NASA, with case files, a sighting map and anonymous discussion boards." />
    <meta property="og:image" content="https://realufo.org/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@realufo_org" />
    <!--/META-->
    <!-- Text sizer (TextSizer.tsx): apply the stored size before first paint. List = TEXT_SCALES minus 100 (src/theme/useTheme.ts). -->
    <script>
      try {
        var ts = JSON.parse(localStorage.getItem("ufo_theme") || "{}").textScale;
        if ([80, 90, 110, 120, 130, 140, 150, 175, 200, 225, 250, 275, 300].indexOf(ts) >= 0) document.documentElement.style.fontSize = ts + "%";
      } catch (e) {}
    </script>
    <!-- Early fetch (docs/superpowers/specs/2026-10-04-realufo-early-fetch-design.md): start this
         route's first API calls now, while the bundle downloads; api.get (src/api/client.ts)
         adopts each once. Paths must equal the hooks' requests: src/tests/earlyFetch.test.ts. -->
    <script>
      try {
        (function () {
          var p = location.pathname, bare = !location.search, list = "/api/records?limit=40&offset=0";
          var paths = ["/api/bootstrap", "/api/hubs"], doc = /^\/doc\/([^/]+)$/.exec(p);
          if (p === "/") paths.push("/api/feed");
          else if (doc) {
            var id = decodeURIComponent(doc[1]);
            paths.push("/api/records/" + id, "/api/records/" + id + "/comments");
            if (bare) paths.push(list);
          } else if (p === "/archive" && bare) paths.push("/api/records/facets", list);
          var headers = {}, anon = null;
          try { anon = localStorage.getItem("ufo_anon"); } catch (e) {}
          if (anon) headers["X-Anon-Id"] = anon;
          var early = (window.__early = {});
          paths.forEach(function (u) {
            early[u] = {
              at: performance.now(),
              p: fetch(u, { headers: headers })
                .then(function (r) {
                  return r.ok ? r.json().then(function (d) { return { d: d, stale: r.headers.get("X-SW-Cache") === "1" }; }) : null;
                })
                .catch(function () { return null; }),
            };
          });
        })();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless visit counts (see /privacy); tracks SPA route changes. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "13e573d65a8c4c99a77eac81561d849f"}'></script>
  </body>
</html>
