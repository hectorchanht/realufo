name: stealline-deploy
# Deploy the StealLine app (own repo: hectorchanht/stealline) to Cloudflare Pages
# with this repo's working API token. Machine-way deploy route, same pattern as
# dawn-admin-deploy.yml. Source of truth stays in the stealline repo.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hectorchanht/stealline
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
      - run: npm i -g wrangler
      - name: Create Pages project (idempotent) + deploy
        run: |
          wrangler pages project create stealline --production-branch=main || true
          wrangler pages deploy dist --project-name=stealline --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
