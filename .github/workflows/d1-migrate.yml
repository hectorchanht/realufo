name: d1-migrate
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration file to apply, e.g. db/migrations/0048_post_images.sql (empty = list pending)"
        default: ""
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "build/app-foundation" }
      - run: npm i -g wrangler
      - run: |
          if [ -z "${{ github.event.inputs.migration }}" ]; then
            wrangler d1 migrations list realufo-db --remote
          else
            # Idempotency guard: only run if the columns are missing.
            MISSING=$(wrangler d1 execute realufo-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('comments') WHERE name='image_keys';" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['results'][0]['n'])")
            if [ "$MISSING" = "0" ]; then
              echo "applying ${{ github.event.inputs.migration }}"
              wrangler d1 execute realufo-db --remote --file "${{ github.event.inputs.migration }}"
            else
              echo "image_keys already present on comments — skipping apply"
            fi
            wrangler d1 execute realufo-db --remote --command "SELECT name FROM pragma_table_info('comments') WHERE name='image_keys'; SELECT name FROM pragma_table_info('posts') WHERE name='image_keys';"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
