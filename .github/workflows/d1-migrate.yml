name: d1-migrate
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration file to apply, e.g. db/migrations/0050_post_images.sql (empty = diagnostic only)"
        default: ""
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "build/app-foundation" }
      - run: npm i -g wrangler
      - run: |
          if [ -z "${{ github.event.inputs.migration }}" ]; then
            echo "=== diagnostic: check image_keys columns ==="
            wrangler d1 execute realufo-db --remote --command "SELECT name FROM pragma_table_info('comments') WHERE name='image_keys';"
            wrangler d1 execute realufo-db --remote --command "SELECT name FROM pragma_table_info('posts') WHERE name='image_keys';"
          else
            echo "=== apply migration ==="
            wrangler d1 execute realufo-db --remote --file "${{ github.event.inputs.migration }}"
            echo "=== verify ==="
            wrangler d1 execute realufo-db --remote --command "SELECT name FROM pragma_table_info('comments') WHERE name='image_keys';"
            wrangler d1 execute realufo-db --remote --command "SELECT name FROM pragma_table_info('posts') WHERE name='image_keys';"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
