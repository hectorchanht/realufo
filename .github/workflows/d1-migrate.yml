name: d1-migrate
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration file to apply, e.g. db/migrations/0048_post_images.sql (empty = diagnostic only)"
        default: ""
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "build/app-foundation" }
      - run: npm i -g wrangler
      - run: |
          echo "=== wrangler version ==="
          wrangler --version
          echo "=== diagnostic: simple select ==="
          wrangler d1 execute realufo-db --remote --command "SELECT 1 AS one;"
          echo "=== exit: $? ==="
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
