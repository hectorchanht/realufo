name: ingest
permissions:
  contents: read
on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run: { description: "dry run (no writes)", type: boolean, default: true }
      sources: { description: "comma sources", default: "wargov,aaro,nasa,nara" }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r crawler/ingest/requirements.txt pytest
      - run: cd crawler && python -m pytest ingest/tests/ -q
      - run: npm i -g wrangler
      - name: ingest
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCES: ${{ github.event.inputs.sources || 'wargov,aaro,nasa,nara' }}
          # scheduled runs write (auto-update); manual dispatch stays dry-run unless dry_run=false
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          if [ "$LIVE" = "true" ]; then
            python -m ingest --sources "$SOURCES" | tee ingest-summary.txt
          else
            python -m ingest --sources "$SOURCES" --dry-run | tee ingest-summary.txt
          fi
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg poppler-utils fonts-dejavu-core
        if: ${{ !cancelled() }}
      # card thumbs for any live record still missing one (new releases ship none);
      # runs even if ingest partly failed so the records it did add get thumbs
      - name: thumbs
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.thumbs | tee -a ingest-summary.txt
          else
            python -m ingest.thumbs --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # X bot + social clips (Spec 4/5): ≤30 s MP4s at clips/ and 9:16 twins at clips-v/
      - name: clips
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.clips | tee -a ingest-summary.txt
            python -m ingest.clips --vertical | tee -a ingest-summary.txt
          else
            python -m ingest.clips --dry-run --limit 1 | tee -a ingest-summary.txt
            python -m ingest.clips --vertical --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # AI key moments for videos still without them (spec 2026-10-02-realufo-ai-key-moments)
      - name: moments
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          # cost: <= 10 videos x <= 15 segments x <= 2 calls = 300 vision calls/day max (cents)
          if [ "$LIVE" = "true" ]; then
            python -m ingest.moments --limit 10 | tee -a ingest-summary.txt
          else
            # manual dry run: segment plan only -- ffmpeg smoke test, no model calls
            python -m ingest.moments --plan-only --limit 1 | tee -a ingest-summary.txt
          fi
      # Ask the Archive: embed any live record not yet in the Vectorize index
      - name: textindex
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.textindex | tee -a ingest-summary.txt
          else
            python -m ingest.textindex --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # Doc-page full text: live PDFs without a record_text row (spec 2026-10-02-realufo-doc-fulltext)
      - name: fulltext
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.fulltext | tee -a ingest-summary.txt
          else
            python -m ingest.fulltext --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # AI summary of new full text (ingest.summaries); NULL rows retried next run
      - name: summaries
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.summaries --limit 50 | tee -a ingest-summary.txt
          else
            python -m ingest.summaries --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # AI visual descriptions of new images (ingest.visuals; ffmpeg from the apt step above);
      # before links so new image text feeds "Same topic"
      - name: visuals
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.visuals --limit 20 | tee -a ingest-summary.txt
          else
            python -m ingest.visuals --dry-run --limit 1 | tee -a ingest-summary.txt
          fi
      # "Same topic" links (ingest.links): full rewrite of record_links, no API calls
      - name: links
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python -m ingest.links | tee -a ingest-summary.txt
          else
            python -m ingest.links --dry-run | tee -a ingest-summary.txt
          fi
      # Ping IndexNow (Bing/Yandex) with pages whose data changed this run; 26 h
      # window = daily cron + slack. Google reads the sitemap instead.
      - name: indexnow
        if: ${{ !cancelled() }}
        working-directory: crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -o pipefail
          if [ "$LIVE" = "true" ]; then
            python indexnow.py --since-hours 26 | tee -a ingest-summary.txt
          else
            python indexnow.py --since-hours 26 --dry-run | tee -a ingest-summary.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-summary
          path: crawler/ingest-summary.txt
  # GitHub disables scheduled workflows after 60 days without repo activity;
  # re-enabling via the API resets that timer. Separate job so it runs even if ingest fails.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable"
