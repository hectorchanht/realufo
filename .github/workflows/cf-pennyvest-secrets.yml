name: cf-pennyvest-secrets
# One-time helper: copies the PENNYVEST_* repo secrets onto the `pennyvest`
# Cloudflare Worker via `wrangler secret put`. GitHub masks secret values in
# logs automatically. Delete the repo secrets after a successful run.
on:
  workflow_dispatch: {}
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "build/app-foundation" }
      - run: npm i -g wrangler
      - run: |
          set -euo pipefail
          put() { printf '%s' "$2" | wrangler secret put "$1" --name pennyvest; }
          put DATABASE_URL "${{ secrets.PENNYVEST_DATABASE_URL }}"
          put NEON_AUTH_BASE_URL "${{ secrets.PENNYVEST_NEON_AUTH_BASE_URL }}"
          put NEON_AUTH_COOKIE_SECRET "${{ secrets.PENNYVEST_NEON_AUTH_COOKIE_SECRET }}"
          put OPENROUTER_API_KEY "${{ secrets.PENNYVEST_OPENROUTER_API_KEY }}"
          put FINNHUB_API_KEY "${{ secrets.PENNYVEST_FINNHUB_API_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
