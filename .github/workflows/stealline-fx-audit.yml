name: stealline-fx-audit
# TEMPORARY one-purpose audit (2026-11-16): read StealLine's D1 fx_rates
# state + latest match FX stamps, commit the result JSON here, so the
# consumer-cache removal can be verified against the table itself.
# Deleted in the same change that deletes stealline-fx.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g wrangler
      - name: Query FX state
        run: |
          set +e
          mkdir -p _analytics/stealline-fx-audit
          wrangler d1 execute stealline-db --remote --json --command "SELECT MAX(date) AS max_date, COUNT(*) AS rows FROM fx_rates;" > fx.json 2>&1
          echo "fx rc=$?"
          wrangler d1 execute stealline-db --remote --json --command "SELECT watch_id, listing_id, gap_pct, saving, fx_rate, fx_date, created_at FROM matches ORDER BY created_at DESC LIMIT 12;" > matches.json 2>&1
          echo "matches rc=$?"
          python3 - <<'PY'
          import json
          out = {}
          for k in ('fx', 'matches'):
              try:
                  out[k] = json.load(open(f'{k}.json'))
              except Exception as e:
                  out[k] = {'error': str(e), 'raw': open(f'{k}.json').read()[-800:]}
          json.dump(out, open('_analytics/stealline-fx-audit/result.json', 'w'), indent=1)
          print('result.json written')
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "stealline-fx-audit"
          git config user.email "actions@github.com"
          git add _analytics/stealline-fx-audit/result.json
          git commit -m "stealline-fx-audit result" || echo "no change"
          git push || true
