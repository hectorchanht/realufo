name: stealline-infra
# StealLine Phase 1 infra: create the D1 database (idempotent) and apply
# the migrations + founder seed from the stealline repo. Fail-soft by
# design: every command's output lands in _analytics/stealline-infra/
# result.json in THIS repo, committed even on failure, so the outcome is
# readable without log access.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { path: realufo }
      - uses: actions/checkout@v4
        with:
          repository: hectorchanht/stealline
          ref: main
          path: stealline
      - run: npm i -g wrangler
      - name: Create D1, apply migrations, verify, record result
        run: |
          set +e
          mkdir -p /tmp/w realufo/_analytics/stealline-infra
          cd /tmp/w
          wrangler d1 create stealline-db > create.log 2>&1; echo "create rc=$?"
          wrangler d1 list > list.log 2>&1; echo "list rc=$?"
          DB_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' create.log | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(python3 - <<'PY'
          import re
          txt = open('list.log').read()
          # wrangler d1 list prints a table: uuid ... name stealline-db
          m = re.search(r'([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})[^\n]*stealline-db', txt)
          if not m:
              rows = [l for l in txt.splitlines() if 'stealline-db' in l]
              m = re.search(r'([0-9a-f-]{36})', rows[0]) if rows else None
          print(m.group(1) if m else '')
          PY
          )
          fi
          echo "DB_ID=$DB_ID"
          for f in "$GITHUB_WORKSPACE"/stealline/migrations/*.sql; do
            echo "=== applying $f ==="
            wrangler d1 execute stealline-db --remote --file "$f" > "mig-$(basename $f).log" 2>&1
            echo "rc=$? (see result.json)"
          done
          wrangler d1 execute stealline-db --remote --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM watches) AS watches, (SELECT COUNT(*) FROM listings) AS listings, (SELECT COUNT(*) FROM reveals) AS reveals, (SELECT COUNT(*) FROM credits) AS credits, (SELECT COUNT(*) FROM matches) AS matches;" > counts.log 2>&1
          echo "counts rc=$?"
          DB_ID="$DB_ID" python3 - <<'PY'
          import json, os, glob
          def tail(p, n=1200):
              try: return open(p).read()[-n:]
              except Exception as e: return f'<missing {p}: {e}>'
          result = {
            'db_id': os.environ.get('DB_ID', ''),
            'create_log': tail('/tmp/w/create.log'),
            'list_log': tail('/tmp/w/list.log'),
            'migrations': {os.path.basename(p): tail(p, 400) for p in sorted(glob.glob('/tmp/w/mig-*.log'))},
            'counts_log': tail('/tmp/w/counts.log', 2000),
          }
          out = os.path.expandvars('$GITHUB_WORKSPACE/realufo/_analytics/stealline-infra/result.json')
          json.dump(result, open(out, 'w'), indent=1)
          print('result.json written')
          PY
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Phase 2 — cascade worker deploy + wiring
        run: |
          set +e
          mkdir -p /tmp/w
          cd /tmp/w
          wrangler d1 execute stealline-db --remote --command "SELECT (SELECT COUNT(*) FROM memberships) AS memberships, (SELECT COUNT(*) FROM cascades) AS cascades, (SELECT COUNT(*) FROM reveal_links) AS reveal_links, (SELECT COUNT(*) FROM reveal_events) AS reveal_events;" > counts2.log 2>&1
          echo "counts2 rc=$?"
          cd "$GITHUB_WORKSPACE/stealline/cascade-worker"
          wrangler deploy > /tmp/w/cascade-deploy.log 2>&1; echo "cascade deploy rc=$?"
          printf %s "${{ secrets.STEALLINE_INGEST_SECRET }}" | wrangler secret put INGEST_SECRET > /tmp/w/cascade-secret.log 2>&1; echo "cascade secret rc=$?"
          CAS_URL=$(grep -oE 'https://stealline-cascade\.[A-Za-z0-9.-]*workers\.dev' /tmp/w/cascade-deploy.log | head -1)
          echo "cascade url: $CAS_URL"
          if [ -n "$CAS_URL" ]; then
            printf %s "$CAS_URL" | wrangler pages secret put CASCADE_API --project-name stealline > /tmp/w/cascade-pages-secret.log 2>&1; echo "pages secret rc=$?"
          else
            echo "no workers.dev URL in deploy log — CASCADE_API not set; the Pages service binding remains the route" > /tmp/w/cascade-pages-secret.log
          fi
          CAS_URL="$CAS_URL" python3 - <<'PY'
          import json, os
          p = os.path.expandvars('$GITHUB_WORKSPACE/realufo/_analytics/stealline-infra/result.json')
          def tail(f, n=1500):
              try: return open(f).read()[-n:]
              except Exception as e: return f'<missing {f}: {e}>'
          try: result = json.load(open(p))
          except Exception: result = {}
          result['cascade_url'] = os.environ.get('CAS_URL', '')
          result['counts2_log'] = tail('/tmp/w/counts2.log', 2000)
          result['cascade_deploy_log'] = tail('/tmp/w/cascade-deploy.log')
          result['cascade_secret_log'] = tail('/tmp/w/cascade-secret.log', 600)
          result['cascade_pages_secret_log'] = tail('/tmp/w/cascade-pages-secret.log', 600)
          json.dump(result, open(p, 'w'), indent=1)
          print('result.json extended with cascade results')
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit result
        if: always()
        run: |
          cd realufo
          git config user.name "stealline-infra"
          git config user.email "actions@github.com"
          git add _analytics/stealline-infra/result.json
          git commit -m "stealline-infra result" || echo "no change"
          git push || true
