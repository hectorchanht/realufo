name: content-drafts-captions

# Pipeline 3 — EN social captions for new Global News Shorts clips.
# Reads the CLIPS manifest in hectorchanht/globalnewsshorts, drafts IG / X /
# Threads captions for clips not yet captioned (tracked in _state/captions.json).
# SOCIAL POST RULE: English-only, always hashtags, SEO-minded, link to the clip page.
# Drafts land in hectorchanht/content-drafts (private). NOTHING auto-publishes.

on:
  schedule:
    - cron: "0 15 * * *" # daily 09:00 MDT (15:00 UTC)
  workflow_dispatch:

concurrency:
  group: content-drafts # shared: serialize all three pipelines so pushes never race
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hectorchanht/content-drafts
          ssh-key: ${{ secrets.CONTENT_DRAFTS_DEPLOY_KEY }}
          path: drafts

      - name: Draft captions for new clips (Workers AI)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, re, time, urllib.request
          from datetime import date

          CF_TOKEN = os.environ["CF_TOKEN"]
          CF_ACCOUNT = os.environ["CF_ACCOUNT"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          STATE = "drafts/_state/captions.json"
          OUTDIR = "drafts/captions"
          TODAY = date.today().isoformat()

          def gh_contents(repo, path):
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  d = json.loads(r.read())
              return base64.b64decode(d["content"]).decode()

          def ai(system, user, retries=2):
              url = f"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}/ai/run/{MODEL}"
              body = json.dumps({"messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user + "\n/no_think"},
              ]}).encode()
              last = None
              for _ in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, data=body, headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=300) as r:
                          out = json.loads(r.read())
                      if not out.get("success", True):
                          last = str(out.get("errors")); time.sleep(10); continue
                      res = out.get("result", {})
                      text = ""
                      if isinstance(res, dict):
                          text = res.get("response") or ""
                          if not text:
                              ch = res.get("choices") or []
                              if ch:
                                  text = ch[0].get("message", {}).get("content", "") or ""
                      text = re.sub(r"<think>.*?</think>", "", str(text), flags=re.S).strip()
                      if text:
                          return text
                      last = "empty response"
                  except Exception as e:
                      last = repr(e)
                  time.sleep(10)
              raise RuntimeError(f"Workers AI failed: {last}")

          def parse_clips(src):
              blocks = re.findall(r'\{\s*"slug":.*?\n    \},', src, re.S)
              clips = []
              for b in blocks:
                  slug = re.search(r'"slug": "([^"]+)"', b)
                  title = re.search(r'"title": "([^"]+)"', b)
                  hook = re.search(r'"hook": "([^"]+)"', b)
                  tags_m = re.search(r'"tags": \[([^\]]*)\]', b)
                  if not (slug and title):
                      continue
                  tags = re.findall(r'"([^"]+)"', tags_m.group(1)) if tags_m else []
                  clips.append({
                      "slug": slug.group(1),
                      "title": title.group(1),
                      "hook": hook.group(1) if hook else "",
                      "tags": tags,
                  })
              return clips

          SYSTEM = ("You write social captions. Rules: English only, always hashtags, "
                    "SEO-minded (work keywords from the title into the copy).")

          def main():
              build_py = gh_contents("hectorchanht/globalnewsshorts", "build.py")
              clips = parse_clips(build_py)
              print(f"found {len(clips)} clips in manifest")
              state = json.load(open(STATE))
              done = set(state.get("done_slugs", []))
              new = [c for c in clips if c["slug"] not in done]
              print(f"{len(new)} new clip(s):", [c["slug"] for c in new])
              os.makedirs(OUTDIR, exist_ok=True)
              for c in new:
                  user = (
                      "Write social captions for this news clip.\n"
                      f"Title: {c['title']}\nHook: {c['hook']}\n"
                      f"Topics: {', '.join(c['tags'])}\n"
                      f"Watch page: https://globalnewsshorts.com/clips/{c['slug']}/\n\n"
                      "Output exactly three sections:\n"
                      "## Instagram\n2-4 sentences + call to action + the watch link + 8-12 hashtags.\n"
                      "## X\nUnder 240 characters + the watch link + 2-4 hashtags.\n"
                      "## Threads\nConversational 1-2 sentences + the watch link + 3-5 hashtags.\n"
                      "English only.")
                  captions = ai(SYSTEM, user)
                  header = ("> AI DRAFT -- verify every claim before publishing (FACT-CHECK RULE).\n"
                            f"> Pipeline: gns-captions | Date: {TODAY} | Clip: {c['title']}\n\n")
                  path = f"{OUTDIR}/{TODAY}-{c['slug']}.md"
                  open(path, "w").write(header + captions.strip() + "\n")
                  print("wrote", path, len(captions), "chars")
                  done.add(c["slug"])
              state["done_slugs"] = sorted(done)
              json.dump(state, open(STATE, "w"), indent=2)
              print("state updated")

          main()
          PYEOF

      - name: Commit and push drafts
        run: |
          cd drafts
          git config user.name "content-drafts-bot"
          git config user.email "content-drafts-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new drafts."
          else
            git commit -m "drafts: captions $(date -u +%F)"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            for i in 1 2 3; do
              git push origin HEAD:main && break
              echo "push attempt $i failed, refetching..."
              sleep 10
              git fetch origin main
              git rebase origin/main || git rebase --abort
            done
          fi
