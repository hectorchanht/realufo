name: stealline-fx
# Daily FX snapshot ping: StealLine's Worker pulls the shared MoneyRate
# rates (Frankfurter-backed) into its D1 fx_rates table, preserving the
# source's rate date. MoneyRate is the single rate origin for Dawn Studio;
# this job only triggers StealLine's snapshot of it.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"
jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger StealLine FX refresh
        run: |
          curl -sS -X POST "https://stealline.dawnstudio.app/api/fx/refresh" \
            -H "x-ingest-secret: ${{ secrets.STEALLINE_INGEST_SECRET }}" \
            -H "content-type: application/json" -d '{}'
          echo
