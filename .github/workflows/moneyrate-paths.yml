name: moneyrate-paths
# One-off: top request paths for moneyrate.lol (30d) to inform the
# positioning rethink. Writes _analytics/moneyrate-paths.json.
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "build/app-foundation" }
      - name: Fetch top paths
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          since = (datetime.date.today() - datetime.timedelta(days=30)).isoformat()
          def gql(query):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
                  method="POST")
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          def api(method, path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + TOKEN}, method=method)
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          out = {"generated_at": datetime.datetime.utcnow().isoformat() + "Z", "zone": "moneyrate.lol"}
          zones = api("GET", "/zones?per_page=50")["result"]
          zid = {z["name"]: z["id"] for z in zones}.get("moneyrate.lol")
          if not zid:
              out["error"] = "zone not found"
          else:
              # introspect the adaptive-groups node for a usable metric field
              insp = gql("{ __type(name: \"ZoneHttpRequestsAdaptiveGroups\") { fields { name } } }")
              t = (insp.get("data") or {}).get("__type")
              node_fields = [f["name"] for f in t["fields"]] if t else []
              out["node_fields"] = node_fields
              metric = None
              if "count" in node_fields:
                  metric, sel = "count", "count"
              else:
                  # introspect the sum type
                  s = gql("{ g: __type(name: \"ZoneHttpRequestsAdaptiveGroups\") { fields { name type { name ofType { name } } } } }")
                  sum_type = None
                  for f in s["data"]["g"]["fields"]:
                      if f["name"] == "sum":
                          sum_type = f["type"]["name"] or (f["type"]["ofType"] or {}).get("name")
                  si = gql("{ __type(name: \"" + sum_type + "\") { fields { name } } }") if sum_type else {}
                  sum_fields = [f["name"] for f in (si.get("data") or {}).get("__type", {}).get("fields", [])]
                  out["sum_fields"] = sum_fields
                  for cand in ("requests", "visits", "pageViews"):
                      if cand in sum_fields:
                          metric, sel = cand, "sum { %s }" % cand
                          break
              if not metric:
                  out["error"] = "no usable metric field found"
              else:
                  q = ("{ viewer { zones(filter: {zoneTag: \"" + zid + "\"}) {"
                       " httpRequestsAdaptiveGroups(limit: 40, filter: {date_gt: \"" + since + "\"},"
                       " orderBy: [%s_DESC]) { dimensions { clientRequestPath } %s } } } }"
                       % ("count" if metric == "count" else "sum_" + metric, sel))
                  r = gql(q)
                  if r.get("errors"):
                      out["error"] = json.dumps(r["errors"])[:500]
                  else:
                      groups = r["data"]["viewer"]["zones"][0]["httpRequestsAdaptiveGroups"]
                      def val(g):
                          return g["count"] if metric == "count" else g["sum"][metric]
                      out["paths"] = sorted(
                          [{"path": g["dimensions"]["clientRequestPath"], "n": val(g)} for g in groups],
                          key=lambda x: -x["n"])[:30]
          os.makedirs("_analytics", exist_ok=True)
          open("_analytics/moneyrate-paths.json", "w").write(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2)[:3500])
          PYEOF
      - name: Commit results
        run: |
          git config user.name "muse"
          git config user.email "muse@local"
          git add _analytics/moneyrate-paths.json
          git diff --cached --quiet && echo "no changes" || git commit -m "moneyrate top paths ($(date -u +%F))" && git push origin build/app-foundation
