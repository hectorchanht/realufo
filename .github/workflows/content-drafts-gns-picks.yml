name: content-drafts-gns-picks

# Pipeline 2 — story picks for Global News Shorts (TEXT-FIRST RULE).
# Each run drafts 3-5 picks (headline + angle + hook) as ONE markdown file.
# Hector picks one story from the file -- video is made ONLY after he picks.
# Drafts land in hectorchanht/content-drafts (private). NOTHING auto-publishes.

on:
  schedule:
    - cron: "0 14 * * 1,4" # Mon + Thu 08:00 MDT (14:00 UTC)
  workflow_dispatch:

concurrency:
  group: content-drafts # shared: serialize all three pipelines so pushes never race
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hectorchanht/content-drafts
          ssh-key: ${{ secrets.CONTENT_DRAFTS_DEPLOY_KEY }}
          path: drafts

      - name: Draft story picks (Workers AI)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, re, time, urllib.request
          from datetime import date

          CF_TOKEN = os.environ["CF_TOKEN"]
          CF_ACCOUNT = os.environ["CF_ACCOUNT"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          OUTDIR = "drafts/gns-story-picks"
          TODAY = date.today().isoformat()

          def gh_contents(repo, path):
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  d = json.loads(r.read())
              return base64.b64decode(d["content"]).decode()

          def ai(system, user, retries=2):
              url = f"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}/ai/run/{MODEL}"
              body = json.dumps({"messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user + "\n/no_think"},
              ]}).encode()
              last = None
              for _ in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, data=body, headers={
                          "Authorization": f"Bearer {CF_TOKEN}",
                          "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=300) as r:
                          out = json.loads(r.read())
                      if not out.get("success", True):
                          last = str(out.get("errors")); time.sleep(10); continue
                      res = out.get("result", {})
                      text = ""
                      if isinstance(res, dict):
                          text = res.get("response") or ""
                          if not text:
                              ch = res.get("choices") or []
                              if ch:
                                  text = ch[0].get("message", {}).get("content", "") or ""
                      text = re.sub(r"<think>.*?</think>", "", str(text), flags=re.S).strip()
                      if text:
                          return text
                      last = "empty response"
                  except Exception as e:
                      last = repr(e)
                  time.sleep(10)
              raise RuntimeError(f"Workers AI failed: {last}")

          def main():
              build_py = gh_contents("hectorchanht/globalnewsshorts", "build.py")
              covered = re.findall(r'"title": "([^"]+)"', build_py)
              covered_str = "; ".join(covered) if covered else "(none yet)"
              print("already covered:", covered_str)

              system = "You are a news-short producer for 'Global News Shorts'."
              user = (
                  f"Today is {TODAY}. Suggest 4 story picks for 60-120 second vertical news videos, "
                  "US/global news audience. Already covered -- do NOT repeat these: "
                  f"{covered_str}.\n"
                  "For each pick output exactly:\n"
                  "### <HEADLINE -- punchy, under 12 words>\n"
                  "**Angle:** 1-2 sentences on why this works as a short video.\n"
                  "**Hook:** the opening spoken line, under 20 words.\n"
                  "Base picks on real, verifiable recent news. If you are not confident a story is "
                  "real, append [UNVERIFIED] to its headline. Plain markdown, no preamble, no conclusion."
              )
              picks = ai(system, user)
              header = ("> AI DRAFT -- verify every claim before publishing (FACT-CHECK RULE).\n"
                        f"> Pipeline: gns-story-picks | Date: {TODAY}\n"
                        "> TEXT-FIRST RULE: Hector picks one story from these -- video is made only "
                        "after he picks. Never generate video from this file.\n\n")
              os.makedirs(OUTDIR, exist_ok=True)
              path = f"{OUTDIR}/{TODAY}-picks.md"
              open(path, "w").write(header + picks.strip() + "\n")
              print("wrote", path, len(picks), "chars")

          main()
          PYEOF

      - name: Commit and push drafts
        run: |
          cd drafts
          git config user.name "content-drafts-bot"
          git config user.email "content-drafts-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new drafts."
          else
            git commit -m "drafts: gns-story-picks $(date -u +%F)"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            for i in 1 2 3; do
              git push origin HEAD:main && break
              echo "push attempt $i failed, refetching..."
              sleep 10
              git fetch origin main
              git rebase origin/main || git rebase --abort
            done
          fi
