<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>OAuth exchange</title></head>
<body>
<h1>Token exchange form</h1>
<form id="f" method="POST" action="https://platform.claude.com/v1/oauth/token">
  <input type="hidden" name="grant_type" value="authorization_code">
  <input type="hidden" name="redirect_uri" value="https://platform.claude.com/oauth/code/callback">
  <input type="hidden" name="client_id" value="9d1c250a-e61b-44d9-88ed-5944d1962f5e">
  <label>code <input type="text" id="code" name="code" size="60"></label><br><br>
  <label>code_verifier <input type="text" id="verifier" name="code_verifier" size="100"></label><br><br>
  <button type="submit" id="go">Exchange</button>
</form>
</body></html>
