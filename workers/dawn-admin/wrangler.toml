# Dawn Studio Admin — Cloudflare Worker + D1.
# Deployed via .github/workflows/dawn-admin-deploy.yml (repo holds the API token).
name = "dawn-studio-admin"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "dawn-admin-db"
database_id = "c48df30e-42f5-412c-b382-4379be3ba561"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "openmusic-analytics"
database_id = "0c644f30-410a-4658-b184-9582077750e6"

[vars]
# REQUIRED by Hector: magic-link From. NOTE: dawnstudio.app is NOT yet a verified
# Resend sending domain (Free plan 3/3 slots full) — sending stays pending until
# he frees a slot or upgrades. Do NOT fall back to another domain.
MAGIC_LINK_FROM = "Dawn Studio <login@dawnstudio.app>"

# Route attached after the dawnstudio.app zone exists (Worker route beats Pages):
routes = [
  { pattern = "dawnstudio.app/admin*", zone_name = "dawnstudio.app" },
]
